<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Projects — CMC Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>.hidden { display: none !important; }</style>
</head>
<body class="page">
  <header class="app-header">
    <div class="container">
      <div class="header-logo">
        <svg viewBox="0 0 40 40" fill="none"><path d="M8 28L16 12l6 10 4-6 6 16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 32h28" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        CMC Tracker
      </div>
      <div class="header-actions">
        <div class="header-user" id="header-user"></div>
        <button class="btn-icon" id="btn-logout" title="Sign out" style="background:rgba(255,255,255,.15);color:white;">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 015.25 2h5.5A2.25 2.25 0 0113 4.25v2a.75.75 0 01-1.5 0v-2a.75.75 0 00-.75-.75h-5.5a.75.75 0 00-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 00.75-.75v-2a.75.75 0 011.5 0v2A2.25 2.25 0 0110.75 18h-5.5A2.25 2.25 0 013 15.75V4.25z" clip-rule="evenodd"/><path fill-rule="evenodd" d="M19 10a.75.75 0 00-.75-.75H8.704l1.048-1.04a.75.75 0 10-1.004-1.115l-2.5 2.5a.75.75 0 000 1.11l2.5 2.5a.75.75 0 101.004-1.114L8.704 10.75H18.25A.75.75 0 0019 10z" clip-rule="evenodd"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="main">
    <div class="container">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;">
        <h1 style="font-size:1.2rem;">Projects</h1>
        <div style="display:flex;gap:.5rem;" class="admin-only hidden">
          <button class="btn btn-ghost btn-sm" id="btn-manage-users">
            <svg viewBox="0 0 20 20" fill="currentColor" style="width:15px;height:15px;"><path d="M7 8a3 3 0 100-6 3 3 0 000 6zM14.5 9a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM1.615 16.428a1.224 1.224 0 01-.569-1.175 6.002 6.002 0 0111.908 0c.058.467-.172.92-.57 1.174A9.953 9.953 0 017 17a9.953 9.953 0 01-5.385-1.572zM14.5 16h-.106c.07-.297.088-.611.048-.933a7.47 7.47 0 00-1.588-3.755 4.502 4.502 0 015.874 2.636.818.818 0 01-.36.98A7.465 7.465 0 0114.5 16z"/></svg>
            Users
          </button>
          <button class="btn btn-primary btn-sm" id="btn-new-project">
            <svg viewBox="0 0 20 20" fill="currentColor" style="width:15px;height:15px;"><path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z"/></svg>
            New Project
          </button>
        </div>
      </div>
      <div class="search-bar">
        <input class="form-control" type="search" id="search-input" placeholder="Search projects…">
        <select class="form-control" id="filter-status" style="max-width:130px;">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="tender">Tender</option>
          <option value="on_hold">On Hold</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div id="project-list"><div class="page-loader"><div class="spinner"></div></div></div>
      <div class="empty-state hidden" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
        <p>No projects found.</p>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modal-project" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="modal-project-title">New Project</h2>
        <button class="btn-icon" id="modal-project-close"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/></svg></button>
      </div>
      <div class="modal-body">
        <form id="form-project" autocomplete="off">
          <div class="form-row">
            <div class="form-group"><label class="form-label">Project Name <span class="required">*</span></label><input class="form-control" type="text" id="p_name" name="p_name" required></div>
            <div class="form-group"><label class="form-label">Project No.</label><input class="form-control" type="text" id="p_no" name="p_no" placeholder="CMC-2024-001"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Client</label><input class="form-control" type="text" id="p_client" name="p_client"></div>
            <div class="form-group"><label class="form-label">Location</label><input class="form-control" type="text" id="p_location" name="p_location"></div>
          </div>
          <div class="form-group"><label class="form-label">Contract Value (RM) <span class="required">*</span></label><input class="form-control" type="number" id="p_contract" name="p_contract" min="0" step="0.01" required></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Start Date</label><input class="form-control" type="date" id="p_start" name="p_start"></div>
            <div class="form-group"><label class="form-label">End Date</label><input class="form-control" type="date" id="p_end" name="p_end"></div>
          </div>
          <div class="form-group"><label class="form-label">Status</label><select class="form-control" id="p_status" name="p_status"><option value="active">Active</option><option value="tender">Tender</option><option value="on_hold">On Hold</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
          <div class="form-group"><label class="form-label">Description</label><textarea class="form-control" id="p_desc" name="p_desc" rows="2"></textarea></div>
          <button type="submit" class="btn btn-primary btn-block">Save Project</button>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-users" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title">Manage Users</h2>
        <button class="btn-icon" id="modal-users-close"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/></svg></button>
      </div>
      <div class="modal-body">
        <p class="text-sm text-muted" style="margin-bottom:.75rem;">Adjust user roles below. New users self-register via the app.</p>
        <div class="section-title">All Users</div>
        <div id="users-list" style="display:flex;flex-direction:column;gap:.5rem;"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
