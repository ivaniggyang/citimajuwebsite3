<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register — CMC Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hidden { display: none !important; }
    .alert { border-radius: .5rem; padding: .65rem .85rem; font-size: .85rem; margin-bottom: 1rem; display: none; }
    .alert-error   { background: #fee2e2; color: #dc2626; }
    .alert-success { background: #dcfce7; color: #16a34a; }
    .divider { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; color: #9ca3af; font-size: .8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="#1a6b3c"/>
          <path d="M8 28L16 12l6 10 4-6 6 16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 32h28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="login-logo-text">CMC Tracker</span>
      </div>
      <p class="login-subtitle">Create your account</p>

      <div class="alert alert-success" id="alert-success">
        Account created! Check your email to confirm your address, then
        <a href="index.html" style="color:#15803d;font-weight:600;">sign in</a>.
      </div>
      <div class="alert alert-error" id="alert-error"></div>

      <form id="form-register">
        <div class="form-group">
          <label class="form-label" for="full_name">Full Name <span style="color:#dc2626">*</span></label>
          <input class="form-control" type="text" id="full_name" name="full_name" placeholder="Ahmad bin Ali" required autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email <span style="color:#dc2626">*</span></label>
          <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone <span style="color:#9ca3af;font-weight:400;">(optional)</span></label>
          <input class="form-control" type="tel" id="phone" name="phone" placeholder="+60 12-345 6789" autocomplete="tel">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password <span style="color:#dc2626">*</span></label>
          <input class="form-control" type="password" id="password" name="password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Confirm Password <span style="color:#dc2626">*</span></label>
          <input class="form-control" type="password" id="confirm" name="confirm" placeholder="Repeat password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-register">Create Account</button>
      </form>

      <div class="divider">or</div>
      <a href="index.html" class="btn btn-ghost btn-block">Sign in to existing account</a>

      <p style="text-align:center;margin-top:1.25rem;font-size:.78rem;color:#9ca3af;line-height:1.5;">
        Your account will be assigned <strong>Site Supervisor</strong> access by default.
        Contact your administrator to change your role.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn   = document.getElementById('btn-register');
      const errEl = document.getElementById('alert-error');
      const okEl  = document.getElementById('alert-success');
      errEl.style.display = 'none';
      okEl.style.display  = 'none';

      const fullName = document.getElementById('full_name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const phone    = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;

      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      const { data, error: signUpError } = await supabase.auth.signUp({
        email, password,
        options: { data: { full_name: fullName } },
      });

      if (signUpError) {
        errEl.textContent = signUpError.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
        return;
      }

      const userId = data.user?.id;
      if (userId) {
        await supabase.from('users').insert({
          id: userId, email, full_name: fullName,
          phone: phone || null, role: 'site_supervisor',
        });
      }

      btn.disabled = false;
      btn.textContent = 'Create Account';
      document.getElementById('form-register').style.display = 'none';
      okEl.style.display = 'block';
    });
  </script>
</body>
</html>
