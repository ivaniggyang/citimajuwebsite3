<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CMC Projects Tracker — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hidden { display: none !important; }
    .login-error {
      background: #fee2e2; color: #dc2626; border-radius: .5rem;
      padding: .65rem .85rem; font-size: .85rem; margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="#1a6b3c"/>
          <path d="M8 28L16 12l6 10 4-6 6 16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 32h28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="login-logo-text">CMC Tracker</span>
      </div>
      <p class="login-subtitle">Construction Project Progress Tracker</p>

      <div class="login-error" id="login-error"></div>

      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email"
            placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password"
            placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">
          Sign In
        </button>
      </form>

      <div class="divider" style="display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:#9ca3af;font-size:.8rem;">
        <span style="flex:1;height:1px;background:#e5e7eb;display:block;"></span>
        or
        <span style="flex:1;height:1px;background:#e5e7eb;display:block;"></span>
      </div>
      <a href="register.html" class="btn btn-ghost btn-block" style="display:flex;align-items:center;justify-content:center;">
        Create an account
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn  = document.getElementById('btn-login');
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = error.message || 'Login failed. Please check your credentials.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
